aid: microsoft-advertising
name: Microsoft Advertising
description: Microsoft Advertising provides APIs for managing ad campaigns, reporting
  on performance, and bulk operations across the Microsoft Advertising network including
  Bing, MSN, and partner sites. The platform offers programmatic access to campaign
  management, reporting, and bulk operations services for advertisers and developers.
