apis:
- aid: microsoft-advertising:campaign-management-api
  name: Microsoft Advertising Campaign Management API
  tags:
  - Advertising
  - Bing Ads
  - Campaigns
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://campaign.api.bingads.microsoft.com/Api/Advertiser/CampaignManagement/v13/
  humanURL: https://learn.microsoft.com/en-us/advertising/campaign-management-service/campaign-management-service-reference
  properties:
  - url: https://learn.microsoft.com/en-us/advertising/campaign-management-service/campaign-management-service-reference
    type: Documentation
  - url: graphql/microsoft-advertising-graphql.md
    type: GraphQL
  description: The Microsoft Advertising Campaign Management API enables programmatic
    management of advertising campaigns, ad groups, ads, keywords, and targeting.
    Developers can create and modify campaign structures, set bids and budgets, manage
    audiences, and configure ad extensions across the Microsoft Advertising network.
- aid: microsoft-advertising:reporting-api
  name: Microsoft Advertising Reporting API
  tags:
  - Advertising
  - Analytics
  - Reporting
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://reporting.api.bingads.microsoft.com/Api/Advertiser/Reporting/v13/
  humanURL: https://learn.microsoft.com/en-us/advertising/reporting-service/reporting-service-reference
  properties:
  - url: https://learn.microsoft.com/en-us/advertising/reporting-service/reporting-service-reference
    type: Documentation
  description: The Microsoft Advertising Reporting API provides access to performance
    reports for campaigns, ad groups, ads, and keywords. Developers can request reports
    on impressions, clicks, conversions, spend, and other metrics with customizable
    date ranges, filters, and aggregation levels.
- aid: microsoft-advertising:bulk-api
  name: Microsoft Advertising Bulk API
  tags:
  - Advertising
  - Batch Processing
  - Bulk Operations
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://bulk.api.bingads.microsoft.com/Api/Advertiser/CampaignManagement/v13/
  humanURL: https://learn.microsoft.com/en-us/advertising/bulk-service/bulk-service-reference
  properties:
  - url: https://learn.microsoft.com/en-us/advertising/bulk-service/bulk-service-reference
    type: Documentation
  description: The Microsoft Advertising Bulk API enables efficient management of
    large-scale advertising campaigns through batch upload and download operations.
    It supports CSV-based bulk operations for creating, updating, and deleting campaigns,
    ad groups, ads, and keywords in a single request.
