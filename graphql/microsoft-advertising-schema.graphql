# -----------------------------------------------------------------------
# Query root
# -----------------------------------------------------------------------

type Query {
  # Account / Customer
  customer(id: ID!): Customer
  account(id: ID!): Account
  accounts(customerId: ID!, first: Int, after: String, status: AccountStatus): AccountConnection!

  # Campaigns
  campaign(id: ID!): Campaign
  campaigns(accountId: ID!, first: Int, after: String, status: CampaignStatus, type: CampaignType): CampaignConnection!

  # Ad Groups
  adGroup(id: ID!): AdGroup
  adGroups(campaignId: ID!, first: Int, after: String, status: AdGroupStatus): AdGroupConnection!

  # Ads
  ad(id: ID!): Ad
  ads(adGroupId: ID!, first: Int, after: String, status: AdStatus, type: AdType): AdConnection!

  # Keywords
  keyword(id: ID!): Keyword
  keywords(adGroupId: ID!, first: Int, after: String, status: KeywordStatus, matchType: BidMatchType): KeywordConnection!

  # Negative Keywords
  negativeKeywordList(id: ID!): NegativeKeywordList
  negativeKeywordLists(accountId: ID!, first: Int, after: String): [NegativeKeywordList!]!

  # Audiences
  audience(id: ID!): Audience
  audiences(accountId: ID!, first: Int, after: String, type: AudienceType): AudienceConnection!

  # Extensions
  extension(id: ID!): Extension
  extensions(accountId: ID!, first: Int, after: String, type: ExtensionType): ExtensionConnection!

  # Budgets
  budget(id: ID!): Budget
  budgets(accountId: ID!): [Budget!]!

  # Labels
  labels(accountId: ID!, first: Int, after: String): LabelConnection!

  # Conversion Goals & UET
  conversionGoal(id: ID!): ConversionGoal
  conversionGoals(accountId: ID!, first: Int, after: String): ConversionGoalConnection!
  uetTag(id: ID!): UETTag
  uetTags(accountId: ID!): [UETTag!]!

  # Reporting
  reportRequest(id: ID!): ReportRequest
  reportRequests(accountId: ID!, first: Int, after: String, status: ReportStatus): ReportRequestConnection!

  # Bulk
  bulkOperation(id: ID!): BulkOperation

  # Performance (inline quick metrics)
  campaignPerformance(campaignId: ID!, startDate: DateTime!, endDate: DateTime!): PerformanceMetrics
  adGroupPerformance(adGroupId: ID!, startDate: DateTime!, endDate: DateTime!): PerformanceMetrics
  keywordPerformance(keywordId: ID!, startDate: DateTime!, endDate: DateTime!): PerformanceMetrics
}

# -----------------------------------------------------------------------
# Mutation root
# -----------------------------------------------------------------------

type Mutation {
  # Campaigns
  createCampaign(input: CreateCampaignInput!): Campaign!
  updateCampaign(input: UpdateCampaignInput!): Campaign!
  deleteCampaign(id: ID!): Boolean!

  # Ad Groups
  createAdGroup(input: CreateAdGroupInput!): AdGroup!
  updateAdGroup(input: UpdateAdGroupInput!): AdGroup!
  deleteAdGroup(id: ID!): Boolean!

  # Ads
  createResponsiveSearchAd(input: CreateResponsiveSearchAdInput!): Ad!
  createExpandedTextAd(input: CreateExpandedTextAdInput!): Ad!
  updateAdStatus(id: ID!, status: AdStatus!): Ad!
  deleteAd(id: ID!): Boolean!

  # Keywords
  createKeyword(input: CreateKeywordInput!): Keyword!
  updateKeyword(input: UpdateKeywordInput!): Keyword!
  deleteKeyword(id: ID!): Boolean!

  # Negative Keywords
  addNegativeKeywordsToList(listId: ID!, keywords: [NegativeKeywordInput!]!): NegativeKeywordList!
  removeNegativeKeywordsFromList(listId: ID!, keywordIds: [ID!]!): Boolean!
  associateNegativeKeywordListToCampaign(listId: ID!, campaignId: ID!): Boolean!
  disassociateNegativeKeywordListFromCampaign(listId: ID!, campaignId: ID!): Boolean!

  # Audiences
  createAudience(input: CreateAudienceInput!): Audience!
  updateAudience(input: UpdateAudienceInput!): Audience!
  deleteAudience(id: ID!): Boolean!
  associateAudienceToAdGroup(adGroupId: ID!, input: AudienceAssociationInput!): AudienceAssociation!
  removeAudienceFromAdGroup(adGroupId: ID!, audienceId: ID!): Boolean!

  # Extensions
  associateExtensionToCampaign(extensionId: ID!, campaignId: ID!): Boolean!
  disassociateExtensionFromCampaign(extensionId: ID!, campaignId: ID!): Boolean!
  associateExtensionToAdGroup(extensionId: ID!, adGroupId: ID!): Boolean!

  # Budgets
  createBudget(input: CreateBudgetInput!): Budget!
  updateBudget(input: UpdateBudgetInput!): Budget!
  deleteBudget(id: ID!): Boolean!

  # Criterions / Targeting
  addCriterionToCampaign(campaignId: ID!, input: CriterionInput!): Criterion!
  updateCampaignCriterion(criterionId: ID!, campaignId: ID!, bidAdjustment: Decimal): Criterion!
  deleteCampaignCriterion(criterionId: ID!, campaignId: ID!): Boolean!
  addCriterionToAdGroup(adGroupId: ID!, input: CriterionInput!): Criterion!
  updateAdGroupCriterion(criterionId: ID!, adGroupId: ID!, bidAdjustment: Decimal): Criterion!
  deleteAdGroupCriterion(criterionId: ID!, adGroupId: ID!): Boolean!

  # Labels
  createLabel(input: CreateLabelInput!): Label!
  updateLabel(input: UpdateLabelInput!): Label!
  deleteLabel(id: ID!): Boolean!
  applyLabelToCampaign(labelId: ID!, campaignId: ID!): Boolean!
  applyLabelToAdGroup(labelId: ID!, adGroupId: ID!): Boolean!
  applyLabelToAd(labelId: ID!, adId: ID!): Boolean!
  applyLabelToKeyword(labelId: ID!, keywordId: ID!): Boolean!

  # Conversion Goals & UET
  createConversionGoal(input: CreateConversionGoalInput!): ConversionGoal!
  updateConversionGoalStatus(id: ID!, status: String!): ConversionGoal!
  deleteConversionGoal(id: ID!): Boolean!
  createUETTag(input: CreateUETTagInput!): UETTag!
  deleteUETTag(id: ID!): Boolean!

  # Reporting
  submitReportRequest(input: ReportRequestInput!): ReportRequest!
  cancelReportRequest(id: ID!): Boolean!

  # Bulk
  submitBulkDownload(input: BulkDownloadInput!): BulkOperation!
  submitBulkUpload(input: BulkUploadInput!): BulkOperation!
}
