  backOfficeServerId: String
  businessName: String
  paymentMethodId: ID
  primaryUserId: ID
  salesHouseCustomerId: ID
  taxInformation: TaxInformation
  created: DateTime!
  modified: DateTime!
  campaigns(first: Int, after: String, status: CampaignStatus): CampaignConnection!
  audiences(first: Int, after: String): AudienceConnection!
}

type Customer {
  id: ID!
  name: String!
  industry: String
