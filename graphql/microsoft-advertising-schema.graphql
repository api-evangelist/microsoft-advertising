"""
Microsoft Advertising (Bing Ads) GraphQL Schema
Derived from the Microsoft Advertising REST/SOAP API surface covering
campaign management, reporting, bulk operations, audiences, and bid strategies.
"""

# -----------------------------------------------------------------------
# Scalars
# -----------------------------------------------------------------------

scalar DateTime
scalar Long
scalar Decimal

# -----------------------------------------------------------------------
# Enums
# -----------------------------------------------------------------------

enum CampaignStatus {
  ACTIVE
  PAUSED
  BUDGET_PAUSED
  DELETED
  SUSPENDED
}

enum CampaignType {
  SEARCH
  SHOPPING
  DISPLAY
  SMART
  PERFORMANCE_MAX
  AUDIENCE
  HOTEL
  DYNAMIC_SEARCH_ADS
}

enum AdGroupStatus {
  ACTIVE
  PAUSED
  DELETED
  EXPIRED
}

enum AdStatus {
  ACTIVE
  PAUSED
  DELETED
  DISAPPROVED
  UNDER_REVIEW
}

enum KeywordStatus {
  ACTIVE
  PAUSED
  DELETED
}

enum BidMatchType {
  BROAD
  PHRASE
  EXACT
  BROAD_MATCH_MODIFIER
}

enum BudgetType {
  DAILY_BUDGET_STANDARD
  DAILY_BUDGET_ACCELERATED
  MONTHLY_BUDGET_SPEND_UNTIL_DEPLETED
}

enum BiddingSchemeType {
  MANUAL_CPC
  ENHANCED_CPC
  TARGET_CPA
  TARGET_ROAS
  MAXIMIZE_CLICKS
  MAXIMIZE_CONVERSIONS
  TARGET_IMPRESSION_SHARE
}

enum AdType {
  TEXT
  IMAGE
  PRODUCT
  EXPANDED_TEXT
  RESPONSIVE_SEARCH
  RESPONSIVE_DISPLAY
  APP_INSTALL
  DYNAMIC_SEARCH
  HOTEL
}

enum DeviceType {
  COMPUTERS
  SMARTPHONES
  TABLETS
  ALL
}

enum AudienceType {
  REMARKETING_LIST
  CUSTOM_AUDIENCE
  PRODUCT_AUDIENCE
  SIMILAR_REMARKETING_LIST
  IN_MARKET
  CUSTOMER_MATCH
  COMBINED
}

enum ExtensionType {
  SITELINK
  CALL
  CALLOUT
  STRUCTURED_SNIPPET
  LOCATION
  IMAGE
  PRICE
  APP
  REVIEW
  PROMOTION
}

enum ReportAggregation {
  SUMMARY
  HOURLY
  DAILY
  WEEKLY
  MONTHLY
  YEARLY
}

enum ReportStatus {
  PENDING
  IN_PROGRESS
  SUCCESS
  ERROR
  EXPIRED
}

enum NetworkType {
  OWNED_AND_OPERATED_WITH_PARTNER_DEMAND
  OWNED_AND_OPERATED_ONLY
  SYNDICATED_SEARCH_PARTNER_ONLY
  COMBINED
}

enum DeliveryStatus {
  CONVERTING
  CONVERTED
  ELIGIBLE
  PAUSED
  REMOVED
  LIMITED
  NOT_ELIGIBLE
}

enum AccountStatus {
  ACTIVE
  INACTIVE
  PAUSED
  PENDING
  SUSPENDED
}

enum CurrencyCode {
  USD
  EUR
  GBP
  CAD
  AUD
  JPY
  CNY
}

enum TargetingDistribution {
  BID_BOOST_ONLY
  TARGET_AND_BID
}

enum BulkOperationStatus {
  NOT_STARTED
  ACTIVE
  COMPLETED
  FAILED
  TIMED_OUT
  CANCELLED
  EXPIRED
}

# -----------------------------------------------------------------------
# Core resource types
# -----------------------------------------------------------------------

type Account {
